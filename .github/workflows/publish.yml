name: Publish Universal Chat Filter v2.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'braunglasrakete/wow-forever-universal-chat-filter'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore and verify tested addon source
        run: |
          base64 --decode .build/UniversalChatFilter.lua.gz.b64 | gzip -d > UniversalChatFilter/UniversalChatFilter.lua
          echo "aaf2b87d073a47bfb9ad82f174ddcee66d95ae1e8158b1d30fa4749ad902d22a  UniversalChatFilter/UniversalChatFilter.lua" | sha256sum -c -
          cp README.md UniversalChatFilter/README.txt

      - name: Commit human-readable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UniversalChatFilter/UniversalChatFilter.lua UniversalChatFilter/README.txt
          git rm .build/UniversalChatFilter.lua.gz.b64
          git commit -m "Publish verified Universal Chat Filter v2.0.0 source"
          git push origin HEAD:main

      - name: Package installable addon
        run: |
          zip -q -r Universal_Chat_Filter_WoW_Forever.zip UniversalChatFilter
          unzip -l Universal_Chat_Filter_WoW_Forever.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 Universal_Chat_Filter_WoW_Forever.zip \
            --title "Universal Chat Filter v2.0.0" \
            --notes-file RELEASE_NOTES.md \
            --target "$(git rev-parse HEAD)"
