name: Package Universal Chat Filter releases

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: universal-chat-filter-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Create installable addon ZIP
        run: |
          test -f UniversalChatFilter/UniversalChatFilter.toc
          test -f UniversalChatFilter/UniversalChatFilter.lua
          zip -q -r Universal_Chat_Filter_WoW_Forever.zip UniversalChatFilter

      - name: Create release or attach missing ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ASSET="Universal_Chat_Filter_WoW_Forever.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
              echo "Release ZIP already exists; leaving it unchanged."
            else
              gh release upload "$RELEASE_TAG" "$ASSET"
            fi
          else
            gh release create "$RELEASE_TAG" "$ASSET" \
              --title "Universal Chat Filter $RELEASE_TAG" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
